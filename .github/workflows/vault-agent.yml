name: Vault Agent

on:
  # Run at minute :18 instead of :00 so the hourly vault-agent (which can
  # occupy the shared keeper-key-serialized concurrency group for 10-20 min)
  # doesn't fire alongside the update-prices (*/5) and keeper (2-59/5) ticks.
  # Update-prices fires at :15 and keeper at :17; :18 lands in the gap right
  # after both, so vault-agent never starts simultaneously with either of the
  # two 5-min crons.
  schedule:
    - cron: "18 * * * *"
  # External scheduler fallback (GitHub's `schedule` trigger drops ~95% of
  # intended ticks for this repo; see docs/KEEPER_OPERATIONS.md). POST to
  # /repos/<owner>/<repo>/dispatches with body {"event_type":"vault-agent-tick"}.
  # The default agent matrix (mining-manager + quality-matrix-manager) runs by default;
  # to dispatch a single agent, send {"event_type":"vault-agent-tick","client_payload":{"agent":"mining-manager"}}.
  # The `vault-manager` agent is retired from CI (run locally via
  # `node scripts/agent-runner.mjs vault-manager` when needed).
  repository_dispatch:
    types: [vault-agent-tick]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Run in dry-run mode (observe only, no writes)"
        required: false
        default: false
        type: boolean
      agent:
        description: "Which agent to run"
        required: false
        default: "all"
        type: choice
        options:
          - all
          - mining-manager
          - quality-matrix-manager
      vault_address:
        description: "Override vault address for this run (empty = use agent's stored vault). Commit step is skipped when set."
        required: false
        default: ""
        type: string
      network:
        description: "Target network"
        required: false
        default: "sepolia"
        type: choice
        options:
          - sepolia

env:
  FOUNDRY_VERSION: v1.5.1

# The commit-results job pushes updated agent memory + metadata back to the
# default branch under the vault-agent[bot] identity. This requires write
# access on the contents scope.
permissions:
  contents: write

# Serialize against every other workflow that signs with KEEPER_PRIVATE_KEY
# (update-prices.yml, keeper.yml) so they can't race on the same nonce. The
# matrix max-parallel: 1 below still serialises mining-manager vs
# quality-matrix-manager within a single run.
concurrency:
  group: keeper-key-serialized
  cancel-in-progress: false

jobs:
  setup-matrix:
    name: Resolve agent matrix
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.build.outputs.matrix }}
    steps:
      - name: Build matrix from trigger + inputs
        id: build
        env:
          EVENT_NAME: ${{ github.event_name }}
          # workflow_dispatch passes via inputs; repository_dispatch via
          # client_payload. Whichever fires populates this; the other is empty.
          AGENT_INPUT: ${{ github.event.inputs.agent || github.event.client_payload.agent }}
        run: |
          set -euo pipefail

          mining_entry='{"agent":"mining-manager","network":"sepolia","deployment_config":"apps/web/src/config/sepolia-deployment.json","rpc_url_secret":"SEPOLIA_RPC_URL"}'
          quality_entry='{"agent":"quality-matrix-manager","network":"sepolia","deployment_config":"apps/web/src/config/sepolia-deployment.json","rpc_url_secret":"SEPOLIA_RPC_URL"}'

          # repository_dispatch may pass a single agent via client_payload.agent
          # (e.g. "mining-manager"); an empty payload falls through to the
          # existing -z check below and runs the default matrix exactly like a
          # scheduled tick. The `vault-manager` agent is retired from CI; passing
          # it here will fall through to the "Unknown agent input" branch.
          if [ "${EVENT_NAME}" = "schedule" ] || [ -z "${AGENT_INPUT}" ] || [ "${AGENT_INPUT}" = "all" ]; then
            # mining-manager: hourly. quality-matrix-manager: every 4h at :18 UTC
            # (18 % 4 == 2) so slow fundamentals get room to play out.
            HOUR_UTC=$(date -u +%H)
            if [ "${EVENT_NAME}" = "schedule" ] && [ $((10#${HOUR_UTC} % 4)) -ne 2 ]; then
              include="[${mining_entry}]"
            else
              include="[${mining_entry},${quality_entry}]"
            fi
          elif [ "${AGENT_INPUT}" = "mining-manager" ]; then
            include="[${mining_entry}]"
          elif [ "${AGENT_INPUT}" = "quality-matrix-manager" ]; then
            include="[${quality_entry}]"
          else
            echo "Unknown agent input: ${AGENT_INPUT}" >&2
            exit 1
          fi

          matrix="{\"include\":${include}}"
          echo "matrix=${matrix}" >> "$GITHUB_OUTPUT"
          echo "Resolved matrix: ${matrix}"

  vault-agent:
    name: Agent "${{ matrix.agent }}" (${{ matrix.network }})
    needs: setup-matrix
    runs-on: ubuntu-latest
    strategy:
      # Don't run mining-manager / quality-matrix-manager in parallel: they
      # share the same keeper key, so concurrent cast send calls race on the
      # same nonce.
      max-parallel: 1
      fail-fast: false
      matrix: ${{ fromJson(needs.setup-matrix.outputs.matrix) }}

    steps:
      # No submodules: the vault-manager-mcp server uses ~700 cast calls and
      # zero forge invocations. Foundry is still installed for `cast` access
      # (no RPC cache: agent never runs forge fork tests).
      - uses: actions/checkout@v5

      - name: Setup CI environment (cached)
        uses: ./.github/actions/setup-snx
        with:
          foundry: "true"

      - name: Run Agent
        env:
          DEPLOYMENT_CONFIG: ${{ matrix.deployment_config }}
          RPC_URL: ${{ secrets[matrix.rpc_url_secret] }}
          # Spoke RPC URLs (same set the keeper uses). The vault-manager MCP
          # reads `<RPC_ALIAS_UPPER>_RPC_URL` to fan `create_vault` out to
          # twin baskets on every configured spoke. Missing secrets cause the
          # MCP to mark that spoke as skipped with `twins[].reason` instead
          # of failing the hub creation — see
          # `apps/mcps/vault-manager/multichain-create.mjs::discoverSpokeContexts`.
          SEPOLIA_RPC_URL: ${{ secrets.SEPOLIA_RPC_URL }}
          FUJI_RPC_URL: ${{ secrets.FUJI_RPC_URL }}
          PRIVATE_KEY: ${{ secrets.KEEPER_PRIVATE_KEY }}
          PROJECT_ROOT: ${{ github.workspace }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
          LLM_MODEL: ${{ secrets.LLM_MODEL || 'gpt-4o' }}
          ATLAS_API_URL: ${{ secrets.ATLAS_API_URL || 'https://atlas.minestarters.com' }}
          ATLAS_API_KEY: ${{ secrets.ATLAS_API_KEY }}
          AGENT_DRY_RUN: ${{ github.event.inputs.dry_run == 'true' && '1' || '' }}
          # GitHub Actions has no TTY; without this, the runner skips all write tools
          # (create_vault, etc.) — see shouldSkipWritesForNonInteractiveSession
          # in scripts/agent-runner-confirmation.mjs.
          AGENT_NON_INTERACTIVE_WRITE_EXECUTE: "1"
          AGENT_MAX_TURNS: "40"
          AGENT_NETWORK: ${{ matrix.network }}
          AGENT_VAULT_OVERRIDE: ${{ github.event.inputs.vault_address }}
        run: node scripts/agent-runner.mjs ${{ matrix.agent }}

      - name: Upload agent outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent-output-${{ matrix.agent }}-${{ matrix.network }}
          # Scope each matrix job's artifact to ONLY its own agent subtree so
          # the two artifacts have non-overlapping file paths. Previously this
          # uploaded `agents/memory/` (the entire tree) from each job, which
          # meant both artifacts contained the same files. When the
          # commit-results job then ran `download-artifact@v4` with
          # `merge-multiple: true`, tar extraction overlaid the SHORTER NEW
          # file onto the LONGER OLD file without truncating, producing
          # Frankenstein JSON (e.g. commit 7e25566 corrupted
          # quality-matrix-manager/state.json so the next run crashed on
          # JSON.parse and CI silently stopped producing commits for ~30h).
          # `apps/web/public/agent-metadata/` stays at directory level
          # because each agent writes a per-vault `<vault>.json` and vault
          # addresses are unique per agent (the two artifacts therefore never
          # collide on a metadata file).
          # `agents/memory/shared/` carries cross-agent state (Yahoo news
          # cache + per-vault recently-closed churn-guard); each agent
          # contributes per-agent / per-vault files (no collisions) and the
          # download-artifact merge unions them back into a single tree.
          path: |
            agents/memory/${{ matrix.agent }}/
            agents/memory/shared/
            apps/web/public/agent-metadata/
          retention-days: 1

  commit-results:
    name: Commit all agent outputs
    needs: vault-agent
    # Skip the commit step for ad-hoc override runs so a one-off vault target
    # never overwrites the agent's canonical state.json on main. Scheduled
    # and external-scheduler (repository_dispatch) ticks always commit.
    if: >-
      always() && (
        github.event_name == 'schedule'
        || github.event_name == 'repository_dispatch'
        || github.event.inputs.vault_address == ''
      )
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      # Belt-and-braces against the artifact-merge corruption documented
      # on the upload step above: scrub ONLY the agent-managed files that
      # the artifact download will write into BEFORE extraction, so a
      # regression to "upload the whole tree" can't leave stale pre-existing
      # bytes that merge with the new artifact into Frankenstein JSON.
      # Preserves `agents/memory/README.md` and
      # `apps/web/public/agent-metadata/README.md` which are checked-in
      # docs and never produced by the agent runner.
      #
      # The post-extract `git add` below uses `--ignore-removal` so this
      # wipe can NEVER leak into the commit as a deletion of tracked files
      # — e.g. when an agent crashes before its memory dir is created and
      # the upload artifact therefore contains nothing under
      # `agents/memory/<agent>/`. Previously that path silently committed
      # deletions of the agent's `state.json` + `run-log.<network>.jsonl`
      # (e.g. commit b7033c1), which in turn produced a modify/delete
      # rebase conflict on the very next tick and aborted the push.
      - name: Clean agent-managed files before artifact extraction
        run: |
          # Wipe every per-agent memory directory but keep `shared/` intact
          # so the cross-agent news cache + recently-closed churn-guard from
          # the current artifact set merges cleanly with what's already on
          # main (per-file keys are agent- or vault-scoped, no collisions).
          find agents/memory -mindepth 1 -maxdepth 1 -type d ! -name shared ! -name archive -exec rm -rf {} +
          find apps/web/public/agent-metadata -maxdepth 1 -type f -name '0x*.json' -delete
      - name: Download all agent outputs
        uses: actions/download-artifact@v4
        with:
          pattern: agent-output-*
          merge-multiple: true
      - name: Commit agent memory and metadata
        run: |
          git config user.name "vault-agent[bot]"
          git config user.email "vault-agent[bot]@users.noreply.github.com"
          # `--ignore-removal` is the explicit opposite of `-A`: only
          # additions and modifications get staged, deletions of tracked
          # files are skipped. This means a missing agent artifact can
          # never wipe that agent's tracked memory from main — the only
          # way to delete an agent's memory is now an explicit human
          # commit.
          git add --ignore-removal agents/memory/ apps/web/public/agent-metadata/
          git diff --cached --quiet && exit 0
          MSG_FILE="$(mktemp)"
          if node scripts/build-agent-commit-message.mjs > "$MSG_FILE"; then
            git commit -F "$MSG_FILE"
          else
            echo "::warning::build-agent-commit-message.mjs failed; falling back to static message"
            git commit -m "memory(agent): update agent memory and metadata"
          fi
          # `--strategy-option=theirs` resolves any residual content
          # conflict in favour of the commits being replayed (in rebase
          # terms "theirs" = the local agent's freshly produced state),
          # so concurrent hourly ticks can't deadlock the push. Safe
          # because files under `agents/memory/<agent>/` are write-once-
          # per-run by `agent-runner.mjs` and never hand-edited.
          git pull --rebase --strategy-option=theirs
          git push

  # ---------------------------------------------------------------------------
  # Self-improver issues channel (see docs/AGENTS_FRAMEWORK.md § Self-Improvement)
  # ---------------------------------------------------------------------------
  # Runs AFTER `commit-results` so the freshly-pushed run log is on `main`
  # when the issues meta-agent reads it via `get_self_improvement_signals`.
  # This job ONLY files GitHub Issues — it never opens code PRs. Humans
  # triage `agent-finding` issues, then type `/agent implement` on an issue
  # to trigger `.github/workflows/issue-implementer.yml`, which runs the
  # `issue-implementer` meta-agent and opens a draft PR.
  #
  #   F.  `node scripts/agent-runner.mjs self-improver-issues` brainstorms
  #       1-3 ideas into `.agent-self-improvement/proposed-issues.json`.
  #   F'. scripts/run-self-improvement-issue-risk-officer.mjs reviews the
  #       manifest (approve / downsize / veto; softer rubric than PR path).
  #   F''. scripts/apply-self-improvement-issues.mjs --open-issues dedupes
  #       and calls `gh issue create` (never edits/closes existing issues).
  #
  # Skipped on ad-hoc workflow_dispatch with `dry_run=true` or
  # `vault_address` set: exploration runs must not alter agent strategy.
  self-improve:
    name: Self-improver issues channel
    needs: commit-results
    if: >-
      always() && needs.commit-results.result == 'success' && (
        github.event_name == 'schedule'
        || github.event_name == 'repository_dispatch'
        || (github.event.inputs.dry_run != 'true' && github.event.inputs.vault_address == '')
      )
    runs-on: ubuntu-latest
    permissions:
      contents: write       # runner persists agents/memory/self-improver-issues/
      issues: write         # for `gh issue create` (Layer F'')
    # Separate concurrency group from the trading agents above: this job
    # never signs anything with KEEPER_PRIVATE_KEY so it doesn't need the
    # `keeper-key-serialized` slot, but it DOES need to serialise against
    # itself so two ticks can't race on the same `agent-improve/...` branch.
    concurrency:
      group: agent-self-improver
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5
        # Need full history so `git checkout -B` from main + `gh pr create`
        # against `--base main` work; `git pull` in commit-results above
        # implies main is reachable.
        with:
          fetch-depth: 0

      - name: Setup CI environment (cached)
        uses: ./.github/actions/setup-snx

      - name: Layer F — run self-improver-issues meta-agent
        if: always()
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
          LLM_MODEL: ${{ secrets.LLM_MODEL || 'gpt-4o' }}
          # `list_open_issues` (a propose_issue-sibling tool on the
          # repo-editor MCP) shells out to `gh issue list`, so the runner
          # needs a GH token. Read-only — token never sees `gh issue create`.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROJECT_ROOT: ${{ github.workspace }}
          # The repo-editor MCP only writes to .agent-self-improvement/,
          # so the runner doesn't need on-chain write execution here. We
          # still set this so the runner doesn't skip `propose_issue`
          # calls due to the non-interactive write-confirmation gate.
          AGENT_NON_INTERACTIVE_WRITE_EXECUTE: "1"
          AGENT_MAX_TURNS: "12"
          AGENT_NETWORK: "sepolia"
        run: node scripts/agent-runner.mjs self-improver-issues

      - name: Layer F' — issue risk-officer review
        if: always()
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
          LLM_MODEL: ${{ secrets.LLM_MODEL || 'gpt-4o' }}
          # `gh issue list` for the openIssues payload used by the cap
          # preflight + LLM context.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROJECT_ROOT: ${{ github.workspace }}
          # Configurable per-period cap on open self-improver-filed
          # issues. The risk-officer vetoes once this is hit; the opener
          # is a belt-and-braces second check.
          MAX_OPEN_SELF_IMPROVER_ISSUES: "10"
        run: node scripts/run-self-improvement-issue-risk-officer.mjs

      - name: Inspect issue risk-officer verdict
        id: issue_verdict
        if: always()
        run: |
          if [ ! -f .agent-self-improvement/issue-risk-officer-verdict.json ]; then
            echo "verdict_kind=missing" >> "$GITHUB_OUTPUT"
            echo "proposal_count=0" >> "$GITHUB_OUTPUT"
            echo "::notice::no issue risk-officer verdict file — issues channel skipped (likely empty manifest)"
            exit 0
          fi
          kind=$(jq -r '.verdict' .agent-self-improvement/issue-risk-officer-verdict.json)
          count=$(jq -r '.proposalCount' .agent-self-improvement/issue-risk-officer-verdict.json)
          dropped=$(jq -r '.droppedCount' .agent-self-improvement/issue-risk-officer-verdict.json)
          echo "verdict_kind=${kind}" >> "$GITHUB_OUTPUT"
          echo "proposal_count=${count}" >> "$GITHUB_OUTPUT"
          echo "dropped_count=${dropped}" >> "$GITHUB_OUTPUT"
          echo "::notice::issue risk-officer verdict=${kind} (${dropped}/${count} issues dropped)"

      - name: Layer F'' — open issues
        if: >-
          always() &&
          steps.issue_verdict.outputs.verdict_kind != 'veto' &&
          steps.issue_verdict.outputs.verdict_kind != 'missing' &&
          steps.issue_verdict.outputs.proposal_count != '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROJECT_ROOT: ${{ github.workspace }}
          MAX_OPEN_SELF_IMPROVER_ISSUES: "10"
        run: node scripts/apply-self-improvement-issues.mjs --open-issues

      - name: Upload self-improver artefacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: self-improver-artefacts
          path: |
            .agent-self-improvement/
            agents/memory/self-improver-issues/
          retention-days: 14
