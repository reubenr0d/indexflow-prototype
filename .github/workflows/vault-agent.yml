name: Vault Agent

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Run in dry-run mode (observe only, no writes)"
        required: false
        default: false
        type: boolean
      network:
        description: "Target network"
        required: false
        default: "sepolia"
        type: choice
        options:
          - sepolia

env:
  FOUNDRY_VERSION: v1.3.1

# The commit-results job pushes updated agent memory + metadata back to the
# default branch under the vault-agent[bot] identity. This requires write
# access on the contents scope.
permissions:
  contents: write

jobs:
  vault-agent:
    name: Agent "vault-manager" (${{ matrix.network }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - network: sepolia
            deployment_config: apps/web/src/config/sepolia-deployment.json
            rpc_url_secret: SEPOLIA_RPC_URL

    steps:
      # No submodules: vault-manager MCP uses ~700 cast calls and zero forge
      # invocations. Foundry is still installed for `cast` access (no RPC
      # cache: agent never runs forge fork tests).
      - uses: actions/checkout@v5

      - name: Setup CI environment (cached)
        uses: ./.github/actions/setup-snx
        with:
          foundry: "true"

      - name: Run Agent
        env:
          DEPLOYMENT_CONFIG: ${{ matrix.deployment_config }}
          RPC_URL: ${{ secrets[matrix.rpc_url_secret] }}
          PRIVATE_KEY: ${{ secrets.KEEPER_PRIVATE_KEY }}
          PROJECT_ROOT: ${{ github.workspace }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
          LLM_MODEL: ${{ secrets.LLM_MODEL || 'gpt-4o' }}
          AGENT_DRY_RUN: ${{ github.event.inputs.dry_run == 'true' && '1' || '' }}
          # GitHub Actions has no TTY; without this, the runner skips all write tools
          # (create_vault, etc.) — see shouldSkipWritesForNonInteractiveSession
          # in scripts/agent-runner-confirmation.mjs.
          AGENT_NON_INTERACTIVE_WRITE_EXECUTE: "1"
          AGENT_MAX_TURNS: "20"
          AGENT_NETWORK: ${{ matrix.network }}
        run: node scripts/agent-runner.mjs vault-manager

      - name: Upload agent outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent-output-${{ matrix.network }}
          path: |
            agents/memory/
            apps/web/public/agent-metadata/
          retention-days: 1

  commit-results:
    name: Commit all agent outputs
    needs: vault-agent
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - name: Download all agent outputs
        uses: actions/download-artifact@v4
        with:
          pattern: agent-output-*
          merge-multiple: true
      - name: Commit agent memory and metadata
        run: |
          git config user.name "vault-agent[bot]"
          git config user.email "vault-agent[bot]@users.noreply.github.com"
          git add agents/memory/ apps/web/public/agent-metadata/
          git diff --cached --quiet && exit 0
          git commit -m "chore(agent): update agent memory and metadata"
          git pull --rebase
          git push
