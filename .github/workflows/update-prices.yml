name: Update Prices

on:
  schedule:
    - cron: "*/5 * * * *"
  # External scheduler (cron-job.org / Cloud Scheduler / etc.) fires this via
  # POST /repos/<owner>/<repo>/dispatches with body {"event_type":"update-prices"}.
  # GitHub's `schedule` trigger drops ~95% of intended ticks for this repo (see
  # docs/KEEPER_OPERATIONS.md "External cron dispatch"), so repository_dispatch
  # is the primary cadence; `schedule` above is best-effort fallback.
  repository_dispatch:
    types: [update-prices]
  pull_request:
  workflow_dispatch:
    inputs:
      network:
        description: "Target network (or 'all' for every configured network)"
        required: false
        default: "all"
        type: choice
        options:
          - all
          - sepolia

env:
  FOUNDRY_VERSION: v1.5.1

# Serialize against every other workflow that signs with KEEPER_PRIVATE_KEY
# (keeper.yml, vault-agent.yml) so they can't race on the same nonce.
concurrency:
  group: keeper-key-serialized
  cancel-in-progress: false

jobs:
  update-prices:
    name: Update Prices (${{ matrix.network }})
    runs-on: ubuntu-latest
    # `matrix` context isn't available in job-level `if:`, so we can't filter
    # the matrix entry here. The work-step `if:` below skips the actual price
    # sync for non-matching workflow_dispatch inputs; the cheap setup steps
    # are allowed to run unconditionally to keep this list short.
    if: >-
      github.event_name == 'schedule'
      || github.event_name == 'repository_dispatch'
      || github.event_name == 'pull_request'
      || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        network: [sepolia]
        include:
          - network: sepolia
            deployment_config: apps/web/src/config/sepolia-deployment.json
            rpc_url_secret: SEPOLIA_RPC_URL

    steps:
      # No submodules: scripts/update-yahoo-finance-prices.js shells to `cast`
      # only; no forge build. Foundry is installed for `cast` access (no RPC
      # cache: no fork tests).
      - uses: actions/checkout@v5

      - name: Setup CI environment (cached)
        uses: ./.github/actions/setup-snx
        with:
          foundry: "true"

      - name: Fetch Yahoo Finance quotes and sync on-chain prices
        if: >-
          github.event_name != 'workflow_dispatch'
          || github.event.inputs.network == 'all'
          || github.event.inputs.network == matrix.network
        env:
          DEPLOYMENT_CONFIG: ${{ matrix.deployment_config }}
          RPC_URL: ${{ secrets[matrix.rpc_url_secret] }}
          PRIVATE_KEY: ${{ github.event_name == 'pull_request' && '' || secrets.KEEPER_PRIVATE_KEY }}
          DRY_RUN: ${{ github.event_name == 'pull_request' && '1' || '' }}
        run: node scripts/update-yahoo-finance-prices.js
