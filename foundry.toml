[profile.default]
src = "src"
out = "out"
test = "test"
script = "script"
libs = ["lib", "node_modules"]
ffi = true
optimizer = true
# Lower runs shrink deployed bytecode (Vault is near EIP-170); 200 was marginally over the limit with VaultMath linked.
optimizer_runs = 1
evm_version = "osaka"
via_ir = true
bytecode_hash = "none"
cbor_metadata = false
auto_detect_solc = true

fs_permissions = [
    { access = "read", path = "node_modules" },
    { access = "read", path = "./out" },
    { access = "read", path = "./cache" },
    { access = "read", path = "./config" },
    { access = "read-write", path = "./apps/web/src/config" },
]

[profile.ci]
fuzz = { runs = 256 }
verbosity = 3

[rpc_endpoints]
local = "http://127.0.0.1:8545"
sepolia = "${SEPOLIA_RPC_URL}"
arbitrum = "${ARBITRUM_RPC_URL}"
arbitrum_sepolia = "${ARBITRUM_SEPOLIA_RPC_URL}"
fuji = "${FUJI_RPC_URL}"
mantle_sepolia = "${MANTLE_SEPOLIA_RPC_URL}"
mantle = "${MANTLE_RPC_URL}"

[etherscan]
# Anvil (chain id 31337 / "anvil-hardhat") needs the alias entry below so that
# Foundry's Etherscan trace identifier — instantiated on every `forge script`
# whenever ETHERSCAN_API_KEY is present in the process environment (any value,
# auto-loaded from .env) — has somewhere to land instead of bailing with
# "No known Etherscan API URL for chain `anvil-hardhat`" (foundry-rs/foundry#11351,
# fixed in #11356 / #11444). The placeholder URL is never contacted because no
# `*:local` flow passes --verify.
#
# We deliberately do NOT set `chain = 31337` here: with the Etherscan v2 client
# in Foundry 1.5.x that field is validated against v2's hard list of supported
# chain IDs, and 31337 isn't on it, which raises a *different* error,
# "Error: Chain anvil-hardhat not supported" (foundry-rs/foundry#10893).
# Omitting `chain` keeps the alias matchable via `--rpc-url local` without
# triggering the v2 chain-support check.
local = { key = "anvil-noop", url = "http://127.0.0.1:8545/verify" }
sepolia = { key = "${ETHERSCAN_API_KEY}", chain = "sepolia" }
arbitrum = { key = "${ARBISCAN_API_KEY}", chain = "arbitrum" }
fuji = { key = "${SNOWTRACE_API_KEY}", chain = "avalanche-fuji" }
mantle_sepolia = { key = "${MANTLESCAN_API_KEY}", chain = 5003, url = "https://api-sepolia.mantlescan.xyz/api" }
mantle = { key = "${MANTLESCAN_API_KEY}", chain = 5000, url = "https://api.mantlescan.xyz/api" }
