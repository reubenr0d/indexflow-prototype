<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="500" viewBox="0 0 1500 500">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="45%" stop-color="#0a0f1a"/>
      <stop offset="100%" stop-color="#134e4a"/>
    </linearGradient>

    <linearGradient id="tri-fill" x1="0.5" y1="1" x2="0.5" y2="0">
      <stop offset="0%" stop-color="#0d9488"/>
      <stop offset="100%" stop-color="#2dd4bf"/>
    </linearGradient>

    <linearGradient id="tri-fill-soft" x1="0.5" y1="1" x2="0.5" y2="0">
      <stop offset="0%" stop-color="#0d9488" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#5eead4" stop-opacity="0.7"/>
    </linearGradient>

    <radialGradient id="bloom-a" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#2dd4bf" stop-opacity="0.35"/>
      <stop offset="60%" stop-color="#2dd4bf" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#2dd4bf" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="bloom-b" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#5eead4" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#5eead4" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="bloom-warm" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#0ea5e9" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#0ea5e9" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="flow-stroke" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2dd4bf" stop-opacity="0"/>
      <stop offset="40%" stop-color="#2dd4bf" stop-opacity="0.65"/>
      <stop offset="100%" stop-color="#0d9488" stop-opacity="0"/>
    </linearGradient>

    <symbol id="tri" viewBox="0 0 100 100" overflow="visible">
      <polygon points="50,8 8,92 92,92"/>
    </symbol>

    <filter id="blur-sm" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5"/>
    </filter>
  </defs>

  <rect width="1500" height="500" fill="url(#bg)"/>

  <ellipse cx="1150" cy="180" rx="520" ry="380" fill="url(#bloom-a)"/>
  <ellipse cx="780"  cy="430" rx="420" ry="260" fill="url(#bloom-b)"/>
  <ellipse cx="320"  cy="120" rx="380" ry="220" fill="url(#bloom-warm)"/>

  <g opacity="0.07" stroke="#5eead4" stroke-width="1" fill="none">
    <path d="M0 80  L1500 80"/>
    <path d="M0 160 L1500 160"/>
    <path d="M0 240 L1500 240"/>
    <path d="M0 320 L1500 320"/>
    <path d="M0 400 L1500 400"/>
    <path d="M0 480 L1500 480"/>
  </g>
  <g opacity="0.05" stroke="#5eead4" stroke-width="1" fill="none">
    <path d="M150 0  L150 500"/>
    <path d="M375 0  L375 500"/>
    <path d="M600 0  L600 500"/>
    <path d="M825 0  L825 500"/>
    <path d="M1050 0 L1050 500"/>
    <path d="M1275 0 L1275 500"/>
  </g>

  <g fill="none" stroke="url(#flow-stroke)" stroke-width="1.4" opacity="0.55">
    <path d="M-50,360 C 280,260 520,420 820,300 S 1280,180 1560,260"/>
    <path d="M-50,300 C 260,200 540,360 820,240 S 1300,120 1560,200" opacity="0.7"/>
    <path d="M-50,420 C 300,320 560,480 860,360 S 1300,260 1560,330" opacity="0.5"/>
  </g>
  <g fill="none" stroke="#2dd4bf" stroke-width="0.6" opacity="0.18">
    <path d="M-50,150 C 280,80 520,200 820,120 S 1280,40 1560,110"/>
    <path d="M-50,220 C 260,140 540,260 820,180 S 1280,100 1560,170"/>
  </g>

  <g fill="url(#tri-fill)" opacity="0.18">
    <use href="#tri" x="600"  y="60"  width="260" height="260"/>
  </g>
  <g fill="url(#tri-fill-soft)" opacity="0.55">
    <use href="#tri" x="720"  y="170" width="160" height="160"/>
  </g>
  <g fill="url(#tri-fill)" opacity="0.92">
    <use href="#tri" x="780"  y="230" width="90"  height="90"/>
  </g>

  <g fill="url(#tri-fill-soft)" opacity="0.40">
    <use href="#tri" x="980"  y="140" width="120" height="120" transform="rotate(180 1040 200)"/>
  </g>
  <g fill="url(#tri-fill)" opacity="0.85">
    <use href="#tri" x="1030" y="200" width="60"  height="60"  transform="rotate(180 1060 230)"/>
  </g>

  <g fill="url(#tri-fill)" opacity="0.65">
    <use href="#tri" x="430" y="280" width="70" height="70" transform="rotate(25 465 315)"/>
  </g>
  <g fill="url(#tri-fill-soft)" opacity="0.35">
    <use href="#tri" x="380" y="240" width="130" height="130" transform="rotate(25 445 305)"/>
  </g>

  <g fill="url(#tri-fill)" opacity="0.75">
    <use href="#tri" x="1180" y="80"  width="50" height="50" transform="rotate(-15 1205 105)"/>
  </g>
  <g fill="url(#tri-fill)" opacity="0.55">
    <use href="#tri" x="1290" y="290" width="40" height="40" transform="rotate(45 1310 310)"/>
  </g>
  <g fill="url(#tri-fill)" opacity="0.50">
    <use href="#tri" x="1380" y="120" width="30" height="30" transform="rotate(10 1395 135)"/>
  </g>
  <g fill="url(#tri-fill)" opacity="0.45">
    <use href="#tri" x="1100" y="380" width="34" height="34" transform="rotate(-30 1117 397)"/>
  </g>

  <g fill="url(#tri-fill)" opacity="0.55">
    <use href="#tri" x="320" y="80"  width="28" height="28"/>
  </g>
  <g fill="url(#tri-fill)" opacity="0.40">
    <use href="#tri" x="540" y="40"  width="20" height="20" transform="rotate(180 550 50)"/>
  </g>
  <g fill="url(#tri-fill)" opacity="0.35">
    <use href="#tri" x="900" y="380" width="22" height="22" transform="rotate(15 911 391)"/>
  </g>
  <g fill="url(#tri-fill)" opacity="0.30">
    <use href="#tri" x="650" y="400" width="18" height="18" transform="rotate(-20 659 409)"/>
  </g>

  <g fill="#5eead4" opacity="0.85">
    <circle cx="820"  cy="275" r="2.5"/>
    <circle cx="1060" cy="230" r="2.5"/>
    <circle cx="465"  cy="315" r="2"/>
    <circle cx="1205" cy="105" r="2"/>
    <circle cx="1310" cy="310" r="1.8"/>
    <circle cx="1395" cy="135" r="1.6"/>
    <circle cx="334"  cy="94"  r="1.6"/>
    <circle cx="550"  cy="50"  r="1.2" opacity="0.6"/>
    <circle cx="911"  cy="391" r="1.4" opacity="0.6"/>
  </g>
  <g stroke="#2dd4bf" stroke-width="0.6" fill="none" opacity="0.25">
    <path d="M820,275 L1060,230"/>
    <path d="M820,275 L465,315"/>
    <path d="M1060,230 L1205,105"/>
    <path d="M1205,105 L1395,135"/>
    <path d="M1060,230 L1310,310"/>
    <path d="M465,315 L334,94"/>
  </g>

  <g fill="url(#tri-fill)" opacity="0.18" filter="url(#blur-sm)">
    <use href="#tri" x="740" y="190" width="180" height="180"/>
  </g>

  <rect x="0" y="0" width="1500" height="500" fill="url(#bg)" opacity="0.05"/>
</svg>
