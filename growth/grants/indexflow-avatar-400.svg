<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="55%" stop-color="#0a0f1a"/>
      <stop offset="100%" stop-color="#134e4a"/>
    </linearGradient>

    <radialGradient id="bloom" cx="0.5" cy="0.55" r="0.55">
      <stop offset="0%"   stop-color="#2dd4bf" stop-opacity="0.30"/>
      <stop offset="60%"  stop-color="#2dd4bf" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#2dd4bf" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="tri-fill" x1="0.5" y1="1" x2="0.5" y2="0">
      <stop offset="0%"   stop-color="#0d9488"/>
      <stop offset="100%" stop-color="#2dd4bf"/>
    </linearGradient>

    <linearGradient id="tri-edge" x1="0.5" y1="0" x2="0.5" y2="1">
      <stop offset="0%"   stop-color="#5eead4" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#5eead4" stop-opacity="0.05"/>
    </linearGradient>

    <clipPath id="circle-clip">
      <circle cx="200" cy="200" r="200"/>
    </clipPath>
  </defs>

  <g clip-path="url(#circle-clip)">
    <rect width="400" height="400" fill="url(#bg)"/>

    <circle cx="200" cy="220" r="180" fill="url(#bloom)"/>

    <circle cx="200" cy="200" r="196"
            fill="none" stroke="#2dd4bf" stroke-opacity="0.18" stroke-width="2"/>

    <polygon points="200,78 60,310 340,310" fill="url(#tri-fill)"/>
    <polygon points="200,78 60,310 340,310"
             fill="none" stroke="url(#tri-edge)" stroke-width="1.5" stroke-linejoin="round"/>
  </g>
</svg>
