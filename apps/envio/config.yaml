# yaml-language-server: $schema=./node_modules/envio/evm.schema.json
name: snx-baskets-hyperindex
description: SNX baskets multichain indexer on Envio HyperIndex

contracts:
  - name: BasketFactory
    abi_file_path: ./abis/BasketFactory.json
    handler: ./src/EventHandlers.ts
    events:
      - event: BasketCreated

  - name: BasketVault
    abi_file_path: ./abis/BasketVault.json
    handler: ./src/EventHandlers.ts
    events:
      - event: Deposited
      - event: Redeemed
      - event: AllocatedToPerp
      - event: WithdrawnFromPerp
      - event: AssetsUpdated
      - event: FeesCollected
      - event: ReservePolicyUpdated
      - event: ReserveToppedUp

  - name: VaultAccounting
    abi_file_path: ./abis/VaultAccounting.json
    handler: ./src/EventHandlers.ts
    events:
      - event: VaultRegistered
      - event: VaultDeregistered
      - event: AssetTokenMapped
      - event: CapitalDeposited
      - event: CapitalWithdrawn
      - event: PositionOpened
      - event: PositionClosed
      - event: PnLRealized
      - event: MaxOpenInterestSet
      - event: MaxPositionSizeSet
      - event: PauseToggled

  - name: OracleAdapter
    abi_file_path: ./abis/OracleAdapter.json
    handler: ./src/EventHandlers.ts
    events:
      - event: AssetConfigured
      - event: AssetRemoved
      - event: PriceUpdated

  - name: StateRelay
    abi_file_path: ./abis/StateRelay.json
    handler: ./src/EventHandlers.ts
    events:
      - event: StateUpdated

networks:
  - id: 11155111 # Sepolia
    start_block: 10891752
    contracts:
      - name: BasketFactory
        address: 0xa9a83c9383da6ea831504f79c68e3230b604145e
        start_block: 10891752
      - name: VaultAccounting
        address: 0xc4a01a3eada32f8ebe1cc05407cd7ef9c2dc86d8
        start_block: 10891752
      - name: OracleAdapter
        address: 0x7edb8cf201d1bfd9e028c94c955fcc161978e7ea
        start_block: 10891752
      - name: StateRelay
        address: 0xa2dcf0b25fce90b5f5d89add2af1ecc101bbcc7d
        start_block: 10891752
      - name: BasketVault

  - id: 43113 # Avalanche Fuji (spoke — only BasketFactory + StateRelay emit events)
    start_block: 55607589
    contracts:
      - name: BasketFactory
        address: 0xb797210b3a6315726bc829599b8b2435fea53c29
        start_block: 55607589
      - name: StateRelay
        address: 0xf6fa7d879ef8aeed74b62121c7f8558eece3a515
        start_block: 55607589
      - name: BasketVault

unordered_multichain_mode: true
preload_handlers: false
address_format: lowercase
