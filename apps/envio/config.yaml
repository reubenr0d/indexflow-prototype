# yaml-language-server: $schema=./node_modules/envio/evm.schema.json
name: snx-baskets-hyperindex
description: SNX baskets multichain indexer on Envio HyperIndex

contracts:
  - name: BasketFactory
    abi_file_path: ./abis/BasketFactory.json
    handler: ./src/EventHandlers.ts
    events:
      - event: BasketCreated

  - name: BasketVault
    abi_file_path: ./abis/BasketVault.json
    handler: ./src/EventHandlers.ts
    events:
      - event: Deposited
      - event: Redeemed
      - event: AllocatedToPerp
      - event: WithdrawnFromPerp
      - event: AssetsUpdated
      - event: FeesCollected
      - event: ReservePolicyUpdated
      - event: ReserveToppedUp

  - name: VaultAccounting
    abi_file_path: ./abis/VaultAccounting.json
    handler: ./src/EventHandlers.ts
    events:
      - event: VaultRegistered
      - event: VaultDeregistered
      - event: AssetTokenMapped
      - event: CapitalDeposited
      - event: CapitalWithdrawn
      - event: PositionOpened
      - event: PositionClosed
      - event: PnLRealized
      - event: MaxOpenInterestSet
      - event: MaxPositionSizeSet
      - event: PauseToggled

  - name: OracleAdapter
    abi_file_path: ./abis/OracleAdapter.json
    handler: ./src/EventHandlers.ts
    events:
      - event: AssetConfigured
      - event: AssetRemoved
      - event: PriceUpdated

  - name: StateRelay
    abi_file_path: ./abis/StateRelay.json
    handler: ./src/EventHandlers.ts
    events:
      - event: StateUpdated

networks:
  - id: 11155111 # Sepolia (hub) — HyperSync silently returns 0 events for this
    # contract set on slug 31d1482 (deployment a9bfc32) despite RPC eth_getLogs
    # proving 2,433+ matching logs exist between blocks 10,891,752 → head. Fuji
    # on the same indexer works, so handlers / ABIs are fine. RPC fallback only
    # activates on primary errors, not on silent-empty responses, so we make RPC
    # the primary sync source (mirrors the Mantle Sepolia hack at id 5003) until
    # Envio confirms the HyperSync data gap is fixed. Trade speed for correctness.
    rpc:
      - url: https://ethereum-sepolia-rpc.publicnode.com
        for: sync
        initial_block_interval: 500
        interval_ceiling: 2000
        query_timeout_millis: 20000
    start_block: 10891752
    contracts:
      - name: BasketFactory
        address: 0xa9a83c9383da6ea831504f79c68e3230b604145e
        start_block: 10891752
      - name: VaultAccounting
        address: 0xc4a01a3eada32f8ebe1cc05407cd7ef9c2dc86d8
        start_block: 10891752
      - name: OracleAdapter
        address: 0x7edb8cf201d1bfd9e028c94c955fcc161978e7ea
        start_block: 10891752
      - name: StateRelay
        address: 0xa2dcf0b25fce90b5f5d89add2af1ecc101bbcc7d
        start_block: 10891752
      - name: BasketVault

  - id: 43113 # Avalanche Fuji (spoke — only BasketFactory + StateRelay emit events)
    start_block: 55607589
    contracts:
      - name: BasketFactory
        address: 0xb797210b3a6315726bc829599b8b2435fea53c29
        start_block: 55607589
      - name: StateRelay
        address: 0xf6fa7d879ef8aeed74b62121c7f8558eece3a515
        start_block: 55607589
      - name: BasketVault

  - id: 5003 # Mantle Sepolia (hub) — NOT in HyperSync (only Mantle mainnet 5000 is),
    # so we MUST use RPC as the primary sync data-source. Without this `rpc:` block
    # the Envio Cloud build fails closed (404 endpoint, no build/runtime logs).
    rpc:
      - url: https://rpc.sepolia.mantle.xyz
        for: sync
        initial_block_interval: 1000
        interval_ceiling: 2000
        query_timeout_millis: 20000
    start_block: 39077789
    contracts:
      - name: BasketFactory
        address: 0xa07a182040a9eb2a398b7853c2af3bd2de5f318c
        start_block: 39077789
      - name: VaultAccounting
        address: 0x7c00248d9b1435b82acf2f44d1e9634d0876ea49
        start_block: 39077789
      - name: OracleAdapter
        address: 0x02879fae6f2d884768f269ac4d350544352e9264
        start_block: 39077789
      - name: StateRelay
        address: 0xf4afb6769b71c06f70a6d717ccf69e5ded962ab5
        start_block: 39077789
      - name: BasketVault

unordered_multichain_mode: true
preload_handlers: false
address_format: lowercase
