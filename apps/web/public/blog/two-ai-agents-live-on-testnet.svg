<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 440" width="920" height="440" fill="none">
  <defs>
    <linearGradient id="ta-bg" x1="0" y1="0" x2="920" y2="440" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#080c14"/>
      <stop offset="100%" stop-color="#0a1019"/>
    </linearGradient>

    <radialGradient id="ta-glow-teal" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#2dd4bf" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#2dd4bf" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="ta-glow-sky" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="ta-glow-amber" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="ta-bar" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#2dd4bf" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#2dd4bf" stop-opacity="0.55"/>
    </linearGradient>
    <linearGradient id="ta-bar-hot" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.75"/>
    </linearGradient>
    <linearGradient id="ta-curve" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2dd4bf" stop-opacity="0.0"/>
      <stop offset="40%" stop-color="#2dd4bf" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.95"/>
    </linearGradient>
    <linearGradient id="ta-ridge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a2332" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#0a1019" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="ta-strata-a" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2dd4bf" stop-opacity="0"/>
      <stop offset="50%" stop-color="#2dd4bf" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#2dd4bf" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="ta-strata-b" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0"/>
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </linearGradient>

    <filter id="ta-glow">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="ta-glow-sm">
      <feGaussianBlur stdDeviation="2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="ta-glow-soft">
      <feGaussianBlur stdDeviation="10" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <marker id="ta-arr-sky" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="8" markerHeight="6" orient="auto">
      <path d="M0 0.5 L9 4 L0 7.5Z" fill="#38bdf8" opacity="0.85"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="920" height="440" rx="12" fill="url(#ta-bg)"/>

  <!-- Ambient glows -->
  <ellipse cx="200" cy="380" rx="240" ry="80" fill="url(#ta-glow-amber)"/>
  <ellipse cx="720" cy="120" rx="260" ry="120" fill="url(#ta-glow-sky)"/>
  <ellipse cx="460" cy="300" rx="320" ry="160" fill="url(#ta-glow-teal)"/>

  <!-- Geological strata (deep earth bands) -->
  <g opacity="0.55">
    <rect x="0" y="338" width="920" height="14" fill="url(#ta-strata-a)"/>
    <rect x="0" y="362" width="920" height="10" fill="url(#ta-strata-b)"/>
    <rect x="0" y="386" width="920" height="18" fill="url(#ta-strata-a)"/>
    <rect x="0" y="416" width="920" height="8" fill="url(#ta-strata-b)"/>
  </g>

  <!-- Subtle grid -->
  <g stroke="#2dd4bf" stroke-opacity="0.04" stroke-width="0.5">
    <line x1="0" y1="110" x2="920" y2="110"/>
    <line x1="0" y1="220" x2="920" y2="220"/>
    <line x1="0" y1="330" x2="920" y2="330"/>
  </g>

  <!-- Mountain ridge silhouette (abstract) -->
  <path d="M 0 340 L 80 290 L 140 320 L 210 240 L 280 295 L 360 220 L 430 280 L 510 200 L 600 260 L 690 195 L 780 250 L 860 210 L 920 245 L 920 440 L 0 440 Z" fill="url(#ta-ridge)" opacity="0.7"/>
  <path d="M 0 340 L 80 290 L 140 320 L 210 240 L 280 295 L 360 220 L 430 280 L 510 200 L 600 260 L 690 195 L 780 250 L 860 210 L 920 245" fill="none" stroke="#2dd4bf" stroke-width="1" stroke-opacity="0.25"/>

  <!-- Peak summit markers (mining sites) -->
  <g fill="#2dd4bf" filter="url(#ta-glow-sm)">
    <circle cx="210" cy="240" r="1.8" opacity="0.6"/>
    <circle cx="360" cy="220" r="1.8" opacity="0.6"/>
    <circle cx="510" cy="200" r="2.2" opacity="0.75"/>
    <circle cx="690" cy="195" r="2.5" opacity="0.85"/>
  </g>

  <!-- Ore vein network (dashed connections between deposits) -->
  <g stroke="#2dd4bf" stroke-opacity="0.18" stroke-width="0.8" stroke-dasharray="3 4" fill="none">
    <path d="M 210 240 Q 290 230 360 220"/>
    <path d="M 360 220 Q 440 215 510 200"/>
    <path d="M 510 200 Q 600 200 690 195"/>
  </g>

  <!-- Candlestick bars: ascending tickers (long-tail equities) -->
  <g>
    <!-- low-priced juniors on the left -->
    <g opacity="0.55">
      <rect x="86" y="316" width="6" height="28" rx="1" fill="url(#ta-bar)"/>
      <line x1="89" y1="306" x2="89" y2="350" stroke="#2dd4bf" stroke-opacity="0.45" stroke-width="0.8"/>
    </g>
    <g opacity="0.6">
      <rect x="118" y="304" width="6" height="40" rx="1" fill="url(#ta-bar)"/>
      <line x1="121" y1="294" x2="121" y2="352" stroke="#2dd4bf" stroke-opacity="0.45" stroke-width="0.8"/>
    </g>
    <g opacity="0.55">
      <rect x="150" y="320" width="6" height="24" rx="1" fill="url(#ta-bar)"/>
      <line x1="153" y1="310" x2="153" y2="348" stroke="#2dd4bf" stroke-opacity="0.4" stroke-width="0.8"/>
    </g>
    <g opacity="0.65">
      <rect x="182" y="290" width="6" height="54" rx="1" fill="url(#ta-bar)"/>
      <line x1="185" y1="278" x2="185" y2="352" stroke="#2dd4bf" stroke-opacity="0.5" stroke-width="0.8"/>
    </g>
    <g opacity="0.6">
      <rect x="214" y="298" width="6" height="46" rx="1" fill="url(#ta-bar)"/>
      <line x1="217" y1="288" x2="217" y2="352" stroke="#2dd4bf" stroke-opacity="0.45" stroke-width="0.8"/>
    </g>
    <g opacity="0.7">
      <rect x="246" y="272" width="6" height="72" rx="1" fill="url(#ta-bar)"/>
      <line x1="249" y1="262" x2="249" y2="356" stroke="#2dd4bf" stroke-opacity="0.5" stroke-width="0.8"/>
    </g>
    <g opacity="0.7">
      <rect x="278" y="284" width="6" height="60" rx="1" fill="url(#ta-bar)"/>
      <line x1="281" y1="274" x2="281" y2="352" stroke="#2dd4bf" stroke-opacity="0.5" stroke-width="0.8"/>
    </g>
    <g opacity="0.75">
      <rect x="310" y="256" width="6" height="88" rx="1" fill="url(#ta-bar)"/>
      <line x1="313" y1="246" x2="313" y2="356" stroke="#2dd4bf" stroke-opacity="0.55" stroke-width="0.8"/>
    </g>
    <g opacity="0.75">
      <rect x="342" y="266" width="6" height="78" rx="1" fill="url(#ta-bar)"/>
      <line x1="345" y1="258" x2="345" y2="356" stroke="#2dd4bf" stroke-opacity="0.55" stroke-width="0.8"/>
    </g>
    <g opacity="0.8">
      <rect x="374" y="238" width="6" height="106" rx="1" fill="url(#ta-bar)"/>
      <line x1="377" y1="228" x2="377" y2="358" stroke="#2dd4bf" stroke-opacity="0.6" stroke-width="0.9"/>
    </g>
    <g opacity="0.8">
      <rect x="406" y="252" width="6" height="92" rx="1" fill="url(#ta-bar)"/>
      <line x1="409" y1="244" x2="409" y2="358" stroke="#2dd4bf" stroke-opacity="0.6" stroke-width="0.9"/>
    </g>
    <g opacity="0.85">
      <rect x="438" y="222" width="6" height="122" rx="1" fill="url(#ta-bar)"/>
      <line x1="441" y1="212" x2="441" y2="360" stroke="#2dd4bf" stroke-opacity="0.65" stroke-width="0.9"/>
    </g>
    <g opacity="0.85">
      <rect x="470" y="232" width="6" height="112" rx="1" fill="url(#ta-bar)"/>
      <line x1="473" y1="222" x2="473" y2="358" stroke="#2dd4bf" stroke-opacity="0.65" stroke-width="0.9"/>
    </g>
    <g opacity="0.9">
      <rect x="502" y="202" width="6" height="142" rx="1" fill="url(#ta-bar)" filter="url(#ta-glow-sm)"/>
      <line x1="505" y1="190" x2="505" y2="362" stroke="#2dd4bf" stroke-opacity="0.7" stroke-width="0.9"/>
    </g>
    <g opacity="0.9">
      <rect x="534" y="216" width="6" height="128" rx="1" fill="url(#ta-bar)" filter="url(#ta-glow-sm)"/>
      <line x1="537" y1="204" x2="537" y2="360" stroke="#2dd4bf" stroke-opacity="0.7" stroke-width="0.9"/>
    </g>

    <!-- right-hand bars: leverage zone, brighter sky-toned -->
    <g opacity="0.95">
      <rect x="566" y="180" width="6" height="164" rx="1" fill="url(#ta-bar-hot)" filter="url(#ta-glow-sm)"/>
      <line x1="569" y1="166" x2="569" y2="362" stroke="#38bdf8" stroke-opacity="0.75" stroke-width="1"/>
    </g>
    <g opacity="0.95">
      <rect x="598" y="196" width="6" height="148" rx="1" fill="url(#ta-bar-hot)" filter="url(#ta-glow-sm)"/>
      <line x1="601" y1="184" x2="601" y2="362" stroke="#38bdf8" stroke-opacity="0.7" stroke-width="1"/>
    </g>
    <g opacity="1">
      <rect x="630" y="156" width="6" height="188" rx="1" fill="url(#ta-bar-hot)" filter="url(#ta-glow)"/>
      <line x1="633" y1="142" x2="633" y2="364" stroke="#38bdf8" stroke-opacity="0.8" stroke-width="1"/>
    </g>
    <g opacity="0.95">
      <rect x="662" y="172" width="6" height="172" rx="1" fill="url(#ta-bar-hot)" filter="url(#ta-glow-sm)"/>
      <line x1="665" y1="160" x2="665" y2="362" stroke="#38bdf8" stroke-opacity="0.75" stroke-width="1"/>
    </g>
    <g opacity="1">
      <rect x="694" y="132" width="6" height="212" rx="1" fill="url(#ta-bar-hot)" filter="url(#ta-glow)"/>
      <line x1="697" y1="118" x2="697" y2="364" stroke="#38bdf8" stroke-opacity="0.85" stroke-width="1.1"/>
    </g>
    <g opacity="1">
      <rect x="726" y="148" width="6" height="196" rx="1" fill="url(#ta-bar-hot)" filter="url(#ta-glow-sm)"/>
      <line x1="729" y1="136" x2="729" y2="362" stroke="#38bdf8" stroke-opacity="0.8" stroke-width="1"/>
    </g>
    <g opacity="1">
      <rect x="758" y="108" width="6" height="236" rx="1" fill="url(#ta-bar-hot)" filter="url(#ta-glow)"/>
      <line x1="761" y1="94" x2="761" y2="364" stroke="#38bdf8" stroke-opacity="0.9" stroke-width="1.1"/>
    </g>
    <g opacity="1">
      <rect x="790" y="124" width="6" height="220" rx="1" fill="url(#ta-bar-hot)" filter="url(#ta-glow-sm)"/>
      <line x1="793" y1="112" x2="793" y2="362" stroke="#38bdf8" stroke-opacity="0.85" stroke-width="1.1"/>
    </g>
    <g opacity="1">
      <rect x="822" y="84" width="6" height="260" rx="1" fill="url(#ta-bar-hot)" filter="url(#ta-glow)"/>
      <line x1="825" y1="68" x2="825" y2="366" stroke="#38bdf8" stroke-opacity="0.95" stroke-width="1.2"/>
    </g>
  </g>

  <!-- Leverage curve: hockey-stick piercing through the bars -->
  <path d="M 60 320 C 220 318, 360 308, 470 280 S 660 180, 870 70" fill="none" stroke="url(#ta-curve)" stroke-width="2.5" stroke-linecap="round" filter="url(#ta-glow)"/>
  <path d="M 60 320 C 220 318, 360 308, 470 280 S 660 180, 870 70" fill="none" stroke="#2dd4bf" stroke-width="0.8" stroke-opacity="0.45" stroke-dasharray="2 6"/>

  <!-- Curve apex node + leverage marker -->
  <circle cx="870" cy="70" r="6" fill="#38bdf8" opacity="0.18" filter="url(#ta-glow-soft)"/>
  <circle cx="870" cy="70" r="3" fill="#38bdf8" opacity="0.9" filter="url(#ta-glow-sm)"/>

  <!-- Floating leverage multiplier ticks (abstract) -->
  <g font-family="ui-monospace, monospace" font-weight="600" opacity="0.7">
    <text x="568" y="172" font-size="9" fill="#38bdf8" opacity="0.55" text-anchor="middle">x2</text>
    <text x="698" y="124" font-size="10" fill="#38bdf8" opacity="0.7" text-anchor="middle">x5</text>
    <text x="826" y="76" font-size="11" fill="#38bdf8" opacity="0.85" text-anchor="middle">x10</text>
  </g>
  <line x1="555" y1="178" x2="582" y2="178" stroke="#38bdf8" stroke-opacity="0.25" stroke-width="0.6"/>
  <line x1="685" y1="130" x2="715" y2="130" stroke="#38bdf8" stroke-opacity="0.3" stroke-width="0.6"/>
  <line x1="812" y1="82" x2="842" y2="82" stroke="#38bdf8" stroke-opacity="0.4" stroke-width="0.6"/>

  <!-- Ore-body specks (scattered nodes) -->
  <g fill="#2dd4bf">
    <circle cx="98" cy="378" r="1" opacity="0.4"/>
    <circle cx="166" cy="392" r="1.4" opacity="0.5"/>
    <circle cx="244" cy="368" r="1" opacity="0.35"/>
    <circle cx="318" cy="402" r="1.2" opacity="0.45"/>
    <circle cx="396" cy="376" r="1" opacity="0.35"/>
    <circle cx="474" cy="394" r="1.4" opacity="0.5"/>
    <circle cx="552" cy="372" r="1" opacity="0.4"/>
    <circle cx="624" cy="398" r="1.6" opacity="0.55"/>
    <circle cx="704" cy="380" r="1.2" opacity="0.45"/>
    <circle cx="780" cy="402" r="1" opacity="0.4"/>
    <circle cx="852" cy="384" r="1.4" opacity="0.55"/>
  </g>

  <!-- Title overlay (very subtle) -->
  <text x="46" y="58" font-family="ui-monospace, monospace" font-size="9" font-weight="600" fill="#2dd4bf" opacity="0.45" letter-spacing="2">LONG-TAIL MINING EQUITIES</text>
  <text x="46" y="74" font-family="system-ui, -apple-system, sans-serif" font-size="9" font-weight="500" fill="#e5e7eb" opacity="0.35" letter-spacing="0.5">leverage as a structural wedge</text>

  <!-- Trailing arrow into the upper-right -->
  <path d="M 836 78 L 882 38" stroke="#38bdf8" stroke-width="1.4" stroke-opacity="0.55" marker-end="url(#ta-arr-sky)"/>
</svg>
