services:
  anvil:
    image: ghcr.io/foundry-rs/foundry:latest
    entrypoint: ["anvil"]
    command: ["--host", "0.0.0.0", "--port", "8545", "--chain-id", "31337"]
    ports:
      - "8545:8545"
    healthcheck:
      test: ["CMD-SHELL", "cast block-number --rpc-url http://127.0.0.1:8545 >/dev/null 2>&1"]
      interval: 2s
      timeout: 2s
      retries: 40

# Envio HyperIndex (apps/envio) runs on the host via `npm run --prefix apps/envio dev:local`.
# It manages its own Postgres + Hasura GraphQL endpoint (default http://127.0.0.1:8080).
